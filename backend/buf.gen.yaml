version: v2
plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.7
    out: .
    opt:
      - paths=import
      - module=github.com/gabrielnakaema/project-chat
  - local:
      - go
      - run
      - google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
    out: .
    opt:
      - paths=import
      - module=github.com/gabrielnakaema/project-chat
inputs:
  - directory: proto
