x-application-environment: &application-environment
  ENV: ${ENV:-production}
  API_PORT: "3333"
  DB_DSN: ${DB_DSN:?DB_DSN must be set}
  PUBSUB_BROKERS: ${PUBSUB_BROKERS:?PUBSUB_BROKERS must be set}
  PUBSUB_TOPIC_PREFIX: ${PUBSUB_TOPIC_PREFIX:-}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}

x-application-service: &application-service
  image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:?IMAGE_NAME must be set}:${IMAGE_TAG:-latest}
  pull_policy: always
  restart: always
  environment: *application-environment

services:
  api:
    <<: *application-service
    environment:
      <<: *application-environment
      INTERNAL_GRPC_LISTEN_ADDRESS: 0.0.0.0:3334

  outbox-relay:
    <<: *application-service
    command: ["./outbox-relay"]
    depends_on:
      - api

  notification-service:
    <<: *application-service
    command: ["./notification-service"]
    depends_on:
      - api

  chat-service:
    <<: *application-service
    command: ["./chat-service"]
    environment:
      <<: *application-environment
      CHAT_INTERNAL_GRPC_LISTEN_ADDRESS: 0.0.0.0:3338
    depends_on:
      - api

  tasks-service:
    <<: *application-service
    command: ["./tasks-service"]
    environment:
      <<: *application-environment
      TASKS_INTERNAL_GRPC_LISTEN_ADDRESS: 0.0.0.0:3340
    depends_on:
      - api

  mcp-service:
    <<: *application-service
    command: ["./mcp-service"]
    environment:
      <<: *application-environment
      AUTHORIZATION_GRPC_TARGET: api:3334
      TASKS_AUTHORIZATION_GRPC_TARGET: tasks-service:3340
    depends_on:
      - api
      - tasks-service

  websocket-service:
    <<: *application-service
    command: ["./websocket-service"]
    environment:
      <<: *application-environment
      AUTHORIZATION_GRPC_TARGET: api:3334
      CHAT_AUTHORIZATION_GRPC_TARGET: chat-service:3338
    depends_on:
      - api
      - chat-service

  gateway:
    image: ${REGISTRY:-ghcr.io}/${GATEWAY_IMAGE_NAME:?GATEWAY_IMAGE_NAME must be set}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: always
    expose:
      - "80"
    depends_on:
      - api
      - notification-service
      - chat-service
      - tasks-service
      - mcp-service
      - websocket-service
