name: project-chat-${ENV_NAME:?ENV_NAME must be set in .env.prod}

x-application-service: &application-service
  image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
  pull_policy: always
  env_file: ${APP_ENV_FILE:-.env.prod}
  restart: always
  networks:
    - project_management_network

x-data-dependencies: &data-dependencies
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_projectmanagement_${ENV_NAME:?ENV_NAME must be set in .env.prod}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 2
      timeout: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - project_management_network

  kafka:
    image: apache/kafka:latest
    container_name: kafka_projectmanagement_${ENV_NAME:?ENV_NAME must be set in .env.prod}
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_LOG_RETENTION_HOURS=168
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - CLUSTER_ID=${CLUSTER_ID}
    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-topics.sh",
          "--list",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      retries: 2
      timeout: 10s
    restart: always
    networks:
      - project_management_network

  api:
    <<: *application-service
    container_name: api_projectmanagement_${ENV_NAME:?ENV_NAME must be set in .env.prod}
    environment:
      INTERNAL_GRPC_LISTEN_ADDRESS: 0.0.0.0:3334
    depends_on: *data-dependencies
    labels:
      - "projectchat.environment=${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "traefik.enable=true"
      - "traefik.docker.network=project_management_network_${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "traefik.http.routers.api-${ENV_NAME}.rule=PathPrefix(`/`)"
      - "traefik.http.routers.api-${ENV_NAME}.priority=1"
      - "traefik.http.routers.api-${ENV_NAME}.service=api-${ENV_NAME}"
      - "traefik.http.services.api-${ENV_NAME}.loadbalancer.server.port=${API_PORT}"

  outbox-relay:
    <<: *application-service
    container_name: outbox_relay_projectmanagement_${ENV_NAME:?ENV_NAME must be set in .env.prod}
    command: ["./outbox-relay"]
    depends_on: *data-dependencies

  notification-service:
    <<: *application-service
    container_name: notification_service_projectmanagement_${ENV_NAME:?ENV_NAME must be set in .env.prod}
    command: ["./notification-service"]
    depends_on: *data-dependencies
    labels:
      - "projectchat.environment=${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "traefik.enable=true"
      - "traefik.docker.network=project_management_network_${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "traefik.http.routers.notification-service-${ENV_NAME}.rule=PathPrefix(`/notifications`)"
      - "traefik.http.routers.notification-service-${ENV_NAME}.priority=10"
      - "traefik.http.routers.notification-service-${ENV_NAME}.service=notification-service-${ENV_NAME}"
      - "traefik.http.services.notification-service-${ENV_NAME}.loadbalancer.server.port=${NOTIFICATION_SERVICE_PORT}"

  chat-service:
    <<: *application-service
    container_name: chat_service_projectmanagement_${ENV_NAME:?ENV_NAME must be set in .env.prod}
    command: ["./chat-service"]
    environment:
      CHAT_INTERNAL_GRPC_LISTEN_ADDRESS: 0.0.0.0:3338
    depends_on: *data-dependencies
    labels:
      - "projectchat.environment=${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "traefik.enable=true"
      - "traefik.docker.network=project_management_network_${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "traefik.http.routers.chat-service-${ENV_NAME}.rule=PathPrefix(`/chats`) || PathRegexp(`^/projects/[^/]+/chat`)"
      - "traefik.http.routers.chat-service-${ENV_NAME}.priority=15"
      - "traefik.http.routers.chat-service-${ENV_NAME}.service=chat-service-${ENV_NAME}"
      - "traefik.http.services.chat-service-${ENV_NAME}.loadbalancer.server.port=${CHAT_SERVICE_PORT:-3337}"

  tasks-service:
    <<: *application-service
    container_name: tasks_service_projectmanagement_${ENV_NAME:?ENV_NAME must be set in .env.prod}
    command: ["./tasks-service"]
    environment:
      TASKS_INTERNAL_GRPC_LISTEN_ADDRESS: 0.0.0.0:3340
    depends_on: *data-dependencies
    labels:
      - "projectchat.environment=${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "traefik.enable=true"
      - "traefik.docker.network=project_management_network_${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "traefik.http.routers.tasks-service-${ENV_NAME}.rule=PathPrefix(`/tasks`)"
      - "traefik.http.routers.tasks-service-${ENV_NAME}.priority=16"
      - "traefik.http.routers.tasks-service-${ENV_NAME}.service=tasks-service-${ENV_NAME}"
      - "traefik.http.services.tasks-service-${ENV_NAME}.loadbalancer.server.port=${TASKS_SERVICE_PORT:-3339}"

  mcp-service:
    <<: *application-service
    container_name: mcp_service_projectmanagement_${ENV_NAME:?ENV_NAME must be set in .env.prod}
    command: ["./mcp-service"]
    environment:
      AUTHORIZATION_GRPC_TARGET: api:3334
      TASKS_AUTHORIZATION_GRPC_TARGET: tasks-service:3340
    depends_on:
      api:
        condition: service_started
      tasks-service:
        condition: service_started
    labels:
      - "projectchat.environment=${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "traefik.enable=true"
      - "traefik.docker.network=project_management_network_${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "traefik.http.routers.mcp-service-${ENV_NAME}.rule=PathPrefix(`/mcp`)"
      - "traefik.http.routers.mcp-service-${ENV_NAME}.priority=12"
      - "traefik.http.routers.mcp-service-${ENV_NAME}.service=mcp-service-${ENV_NAME}"
      - "traefik.http.services.mcp-service-${ENV_NAME}.loadbalancer.server.port=${MCP_SERVICE_PORT:-3341}"

  websocket-service:
    <<: *application-service
    container_name: websocket_service_projectmanagement_${ENV_NAME:?ENV_NAME must be set in .env.prod}
    command: ["./websocket-service"]
    environment:
      AUTHORIZATION_GRPC_TARGET: api:3334
      CHAT_AUTHORIZATION_GRPC_TARGET: chat-service:3338
    depends_on:
      api:
        condition: service_started
      chat-service:
        condition: service_started
      kafka:
        condition: service_healthy
    labels:
      - "projectchat.environment=${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "traefik.enable=true"
      - "traefik.docker.network=project_management_network_${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "traefik.http.routers.websocket-service-${ENV_NAME}.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.websocket-service-${ENV_NAME}.priority=20"
      - "traefik.http.routers.websocket-service-${ENV_NAME}.service=websocket-service-${ENV_NAME}"
      - "traefik.http.services.websocket-service-${ENV_NAME}.loadbalancer.server.port=${WEBSOCKET_SERVICE_PORT:-3336}"

  gateway:
    image: traefik:v3.6.17
    container_name: gateway_projectmanagement_${ENV_NAME:?ENV_NAME must be set in .env.prod}
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=project_management_network_${ENV_NAME:?ENV_NAME must be set in .env.prod}"
      - "--providers.docker.constraints=Label(`projectchat.environment`,`${ENV_NAME:?ENV_NAME must be set in .env.prod}`)"
      - "--entrypoints.web.address=:80"
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
      - notification-service
      - chat-service
      - websocket-service
    restart: always
    networks:
      - project_management_network

volumes:
  postgres_data:
    name: postgres_data_${ENV_NAME:?ENV_NAME must be set in .env.prod}
    external: true
  kafka_data:
    name: kafka_data_${ENV_NAME:?ENV_NAME must be set in .env.prod}
    external: true

networks:
  project_management_network:
    name: project_management_network_${ENV_NAME:?ENV_NAME must be set in .env.prod}
