services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_projectmanagement_${ENV_NAME}
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 2
      timeout: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - project_management_network

  kafka:
    image: apache/kafka:latest
    container_name: kafka_projectmanagement_${ENV_NAME}
    env_file: .env.prod
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_LOG_RETENTION_HOURS=168
    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-topics.sh",
          "--list",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      retries: 2
      timeout: 10s
    restart: always
    networks:
      - project_management_network

  api:
    container_name: api_projectmanagement_${ENV_NAME}
    image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    pull_policy: always
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always
    networks:
      - project_management_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.api.priority=1"
      - "traefik.http.services.api.loadbalancer.server.port=${API_PORT}"

  notification-service:
    container_name: notification_service_projectmanagement_${ENV_NAME}
    image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    pull_policy: always
    command: ["./notification-service"]
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always
    networks:
      - project_management_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notification-service.rule=PathPrefix(`/notifications`)"
      - "traefik.http.routers.notification-service.priority=10"
      - "traefik.http.services.notification-service.loadbalancer.server.port=${NOTIFICATION_SERVICE_PORT}"

  websocket-service:
    container_name: websocket_service_projectmanagement_${ENV_NAME}
    image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    pull_policy: always
    command: ["./websocket-service"]
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: always
    networks:
      - project_management_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.websocket-service.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.websocket-service.priority=20"
      - "traefik.http.services.websocket-service.loadbalancer.server.port=${WEBSOCKET_SERVICE_PORT:-3336}"

  gateway:
    image: traefik:v3.1
    container_name: gateway_projectmanagement_${ENV_NAME}
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=project_management_network_${ENV_NAME}"
      - "--entrypoints.web.address=:80"
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
      - notification-service
      - websocket-service
    restart: always
    networks:
      - project_management_network

volumes:
  postgres_data:
    name: postgres_data_${ENV_NAME}
  kafka_data:
    name: kafka_data_${ENV_NAME}

networks:
  project_management_network:
    name: project_management_network_${ENV_NAME}
